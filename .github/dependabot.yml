version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Europe/Riga
    open-pull-requests-limit: 3
    groups:
      mozaik:
        patterns:
          - '@mozaik-ai/*'
      development-tooling:
        dependency-type: development
        patterns:
          - '*'
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:15'
      timezone: Europe/Riga
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
