name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: proofgate:smoke
      - name: Start smoke container
        run: >-
          docker run --detach --name proofgate-smoke
          --read-only --tmpfs /tmp:size=16m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true
          --publish 4173:4173 proofgate:smoke
      - name: Verify health endpoint
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:4173/api/health
      - name: Stop smoke container
        if: always()
        run: docker rm --force proofgate-smoke
